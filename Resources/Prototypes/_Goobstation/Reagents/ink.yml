- type: reagent
  id: InkCyan
  name: cyan ink
  desc: cyan pigment in a printable suspension. To be inserted in printer cartridges.
  physicalDesc: opaque
  color: "#00ffff"
  flavor: cyan
  metabolisms:
    Poison:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.1
            Asphyxiation: 0.05
        conditions:
        - !type:OrganType
          type: Yowie
          shouldHave: false
      - !type:Paralyze
        conditions:
        - !type:OrganType
          type: Yowie
          shouldHave: false
        probability: 0.01
        paralyzeTime: 2
      - !type:Emote
        emote: Gasp
        probability: 0.05
        conditions:
        - !type:OrganType
          type: Yowie
          shouldHave: false

