- type: entity
  parent: BaseItem
  id: CartridgeInkBase
  abstract: true
  name: printer cartridge
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/ink.rsi
    layers:
      - state: base
      - state: color
        color: "#ffffff"
  - type: SolutionContainerManager
    solutions:
      ink:
        maxVol: 100
  - type: DrainableSolution
    solution: ink
  - type: ExaminableSolution
    solution: ink
  - type: DrawableSolution
    solution: ink
  - type: InjectableSolution
    solution: ink
  - type: Drink
    solution: ink
  - type: SolutionTransfer
    canChangeTransferAmount: true

- type: entity
  parent: CartridgeInkBase
  id: CartridgeInkCyan
  name: cyan printer cartridge
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/ink.rsi
    layers:
      - state: base
      - state: color
        color: "#00bcd4"
  - type: InkCartridge
    solutionName: ink
  - type: SolutionContainerManager
    solutions:
      ink:
        maxVol: 100
        reagents:
        - ReagentId: InkCyan
          Quantity: 100
  - type: Tag
    tags: [ InkCartridgeC ]

